[workspace]
members = [
  "crates/pennykite-types",
  "crates/pennykite-budget",
  "crates/pennykite-detect",
  "crates/pennykite-cost",
  "crates/pennykite-ledger",
  "crates/pennykite-providers",
  "crates/pennykite-kite",
  "crates/pennykite-proxy",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.34", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
alloy = { version = "2", default-features = false, features = ["essentials", "signer-local", "sol-types", "dyn-abi"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha3 = "0.10"
hex = "0.4"
base64 = "0.22"
serde_yaml = "0.9"
