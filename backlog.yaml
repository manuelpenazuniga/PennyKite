    owner: lead
    estimated_effort_h: 0.1
    dependencies: [PK-INIT-01, PK-INIT-02, PK-INIT-03]
    acceptance_criteria:
      - "origin/main contains .gitignore, README.md, backlog.yaml"
      - "Commit message follows conventional commits"
      - "git status is clean after push"
    artifacts: []
    status: done
    priority: critical
    tags: [git]

