# =============================================================================
# PennyKite — Execution Backlog
# -----------------------------------------------------------------------------
# Machine-readable, atomic execution plan derived from PENNYKITE_ROADMAP_KITE.md.
# Each task is self-contained enough to be picked up by an autonomous developer
# agent (e.g. Sonnet 4.6) without re-reading the source roadmap.
#
# Conventions:
#   id                  : "PK-<phase>-<index>" (stable, sortable).
#   status              : pending | in_progress | blocked | done | cancelled.
#   priority            : critical | high | medium | low.
#   owner               : lead | backend | frontend | all (logical role,
#                          maps to a single solo-builder if working alone).
#   estimated_effort_h  : float, hours of focused work.
#   dependencies        : list of task ids that MUST be done before starting.
#   acceptance_criteria : list of objective, testable bullets.
#   artifacts           : files / directories the task creates or modifies.
#   references          : doc anchors and external URLs.
#   tags                : free-form labels for filtering.
# =============================================================================

metadata:
  project: PennyKite
  version: "0.1.0"
  hackathon:
    name: "Kite AI Global Hackathon 2026"
    organiser: "Encode Club"
    submission_deadline: "2026-05-25"
    finale: "2026-05-25T16:00:00+01:00"
    primary_track: "Novel"
    secondary_track: "Agentic Commerce"
  goal: >-
    Ship a public, MIT-licensed, end-to-end working demo of a pre-execution
    budget guardian for AI agents that settles micropayments via x402 and
    anchors decisions on Kite chain.
  success_criteria:
    - Public GitHub repo with reproducible quickstart
    - Hosted demo (proxy + dashboard) on public URLs
    - Smart contract deployed on Kite testnet (address documented)
    - 2-5 minute demo video on YouTube
    - Submission filed on Encode/Devpost before deadline
  strategic_flags:
    - id: SF-01
      title: "Mirror PennyPrompt crate decomposition"
      description: >-
        The original roadmap lists only 2 Rust crates; PennyPrompt already
        provides 12 specialised crates that map almost 1:1 to PennyKite's
        needs (penny-budget, penny-detect, penny-cost, penny-ledger,
        penny-providers, etc.). Tasks below adopt this richer split.
      impact: positive
    - id: SF-02
      title: "TypeScript signing sidecar as Plan A for x402"
      description: >-
        EIP-3009 signing in Rust is the highest-risk task in the build.
        A TS sidecar using @x402/client is offered as task PK-D2-07b that
        can replace PK-D2-07 on Day 2 if Rust signing slips beyond 4h.
      impact: risk_mitigation
    - id: SF-03
      title: "Dual-tag Novel + Agentic Commerce on submission"
      description: >-
        PennyKite literally fits the Agentic Commerce rubric. Submitting
        primarily to Novel while listing Commerce as secondary maximises
        prize-pool exposure with zero code change.
      impact: positive
    - id: SF-04
      title: "Public docs path conflict resolved"
      description: >-
        The /docs directory is gitignored to keep private design materials
        out of the public repo. Future public documentation (architecture,
        kite-integration, x402-flow) lives under /documentation instead.
      impact: hygiene
  references:
    project_definition: "docs/PENNYKITE_PROJECT_KITE.md (private)"
    roadmap: "docs/PENNYKITE_ROADMAP_KITE.md (private)"
    hackathon_brief: "docs/Kite_AI_Hackathon_EncodeClub.md (private)"
    pennyprompt_reference: "resources/PennyPrompt (private)"
    kite_docs: "https://docs.gokite.ai/"
    x402_repo: "https://github.com/coinbase/x402"
    x402_exact_evm_spec: "https://github.com/coinbase/x402/blob/main/specs/schemes/exact/scheme_exact_evm.md"

# -----------------------------------------------------------------------------
# Phases (labels only; tasks reference them via the `phase` field)
# -----------------------------------------------------------------------------
phases:
  - id: phase-0
    label: "Pre-arrangement"
    window: "2026-05-15 → 2026-05-19"
    description: "Background work executed in parallel with AgentTrust submission."
  - id: phase-init
    label: "Repo initialisation"
    window: "2026-05-15"
    description: ".gitignore, README, backlog, scaffolding placeholders."
  - id: phase-1
    label: "Day 1 — Scaffold + Kite + x402 prototype"
    window: "2026-05-20"
  - id: phase-2
    label: "Day 2 — x402 parsing, signing, atomic ledger"
    window: "2026-05-21"
  - id: phase-3
    label: "Day 3 — Loop detector, demo target, runaway agent"
    window: "2026-05-22"
  - id: phase-4
    label: "Day 4 — Polish, hosting, video"
    window: "2026-05-23"
  - id: phase-5
    label: "Day 5 — Buffer + writeup"
    window: "2026-05-24"
  - id: phase-6
    label: "Day 6 — Submission + Finale"
    window: "2026-05-25"
  - id: phase-cross
    label: "Cross-cutting (CI, DX, hygiene)"
    window: "continuous"

# -----------------------------------------------------------------------------
# Tasks
# -----------------------------------------------------------------------------
tasks:

  # =====================================================
  # PHASE INIT — repo bootstrap (today)
  # =====================================================
  - id: PK-INIT-01
    phase: phase-init
    title: "Configure .gitignore"
    description: >-
      Author a comprehensive .gitignore that excludes secrets, build
      artefacts (Rust target, Node, Python, Foundry), local databases,
      OS noise, and explicitly the docs/ and resources/ directories
      so private design docs and the PennyPrompt reference are kept out
      of the public repo.
    owner: lead
    estimated_effort_h: 0.25
    dependencies: []
    acceptance_criteria:
      - "/.gitignore exists at repo root"
      - "Ignores: .env, target/, node_modules/, __pycache__/, contracts/out/, *.db, .DS_Store"
      - "Explicitly ignores docs/ and resources/"
      - "Whitelists .env.example via negation rule"
    artifacts: [".gitignore"]
    status: done
    priority: critical
    tags: [scaffold, hygiene]

  - id: PK-INIT-02
    phase: phase-init
    title: "Author public README.md"
    description: >-
      Top-tier OSS README in English: badges, value proposition, problem
      statement, architecture diagram, comparison table, quickstart in
      three commands, project structure, configuration, SDK examples,
      roadmap, contributing, licence, acknowledgements.
    owner: lead
    estimated_effort_h: 1.0
    dependencies: [PK-INIT-01]
    acceptance_criteria:
      - "/README.md exists at repo root"
      - "Includes badges (license, status, hackathon, track, stack)"
      - "Includes ASCII architecture diagram"
      - "Includes 3-command quickstart"
      - "Strictly English"
    artifacts: ["README.md"]
    status: done
    priority: critical
    tags: [docs, marketing]

  - id: PK-INIT-03
    phase: phase-init
    title: "Generate backlog.yaml"
    description: >-
      Translate the roadmap (PENNYKITE_ROADMAP_KITE.md) into a meticulous
      machine-readable execution plan with atomic tasks, dependencies,
      acceptance criteria and references — this very file.
    owner: lead
    estimated_effort_h: 1.5
    dependencies: [PK-INIT-02]
    acceptance_criteria:
      - "/backlog.yaml exists at repo root"
      - "Every task has id, status, acceptance_criteria, dependencies"
      - "Tasks are atomic (≤ 4h estimated effort each, ideally)"
    artifacts: ["backlog.yaml"]
    status: done
    priority: critical
    tags: [planning]

  - id: PK-INIT-04
    phase: phase-init
    title: "Initial commit + push to main"
    description: >-
      Stage .gitignore, README.md and backlog.yaml. Commit with a clear
      conventional message. Push to origin/main so CI scaffolding can be
