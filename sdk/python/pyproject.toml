[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pennykite"
version = "0.1.0"
description = "Python convenience client for PennyKite proxy sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["pennykite"]
